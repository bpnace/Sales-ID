name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build Debug
        run: xcodebuild -project SalesID.xcodeproj -scheme SalesID -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
